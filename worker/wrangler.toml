name = "dynex-bot-ai5dcf"
main = "src/index.js"
compatibility_date = "2026-11-21"

# Create the D1 database, apply worker/migrations/0001_api_platform.sql,
# then replace the database_id below with the ID returned by Wrangler.
[[d1_databases]]
binding = "DYNEX_DB"
database_name = "dynex-api-platform"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Configure in Cloudflare Worker settings:
# GEMINI_API_KEY        (existing secret)
# DYNEX_ADMIN_SECRET    (new secret; owner-only API controls)
# DYNEX_ALLOWED_ORIGIN  (exact origin hosting developers.html)
