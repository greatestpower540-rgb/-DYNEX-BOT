
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf9f7">
  <meta name="description" content="DYNEX BOT - Your intelligent AI assistant.">
  <title>DYNEX BOT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-navigation">
    <button class="round-icon" aria-label="Profile">◎</button>

    <div class="navigation-pill">
      <button class="nav-tab active" aria-label="Search">⌕</button>
      <button class="nav-tab" aria-label="Library">▣</button>
    </div>

    <a class="developer-link" href="developers.html">Developer API ↗</a>
    <button class="round-icon" aria-label="History">▤</button>
  </header>

  <main class="main-screen">

    <section class="announcement">
      <button class="close-announcement" aria-label="Close">×</button>

      <div class="announcement-orb">
        <div class="robot">
          <div class="robot-face">
            <div class="robot-eyes">
              <span></span>
              <span></span>
            </div>
            <div class="robot-mouth"></div>
          </div>
          <div class="robot-base"></div>
        </div>
      </div>

      <h1>DYNEX BOT is now available</h1>

      <p>Research, create, and build</p>
      <p>from a single prompt</p>
    </section>

    <section class="recent-section">
      <h2>Recently updated</h2>

      <div class="recent-item">
        <span class="status-icon">✓</span>
        <strong>Welcome to DYNEX BOT</strong>
        <span class="recent-time">Just now</span>
        <button class="more-button" aria-label="More options">⋮</button>
      </div>
    </section>

  </main>

  <section class="composer">
    <textarea
      id="promptInput"
      placeholder="Ask anything..."
      rows="2"
      aria-label="Ask anything"
    ></textarea>

    <div class="composer-controls">
      <button class="control-button" aria-label="Add">＋</button>
      <button class="model-button">Model</button>

      <div class="control-spacer"></div>

      <button class="control-button" aria-label="Tools">♧</button>
      <button class="control-button" aria-label="Microphone">♩</button>
      <button class="voice-button" aria-label="Voice mode">▥</button>
    </div>
  </section>

  <script src="js/assistant.js"></script>
</body>
</html>
