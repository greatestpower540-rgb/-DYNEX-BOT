name: Refresh DYNEX mobile lockfile

on:
  push:
    branches:
      - dynex-media-upload
    paths:
      - "mobile/package.json"
      - "mobile/App.js"
      - "worker/src/index.js"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dynex-media-upload
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Generate a matching npm lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify a clean install
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git diff --cached --quiet || git commit -m "Update DYNEX mobile dependency lockfile"
          git push
